name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Dhrona1421&show_icons=true&theme=merko&hide_border=true&bg_color=050f05&title_color=00FF41&icon_color=00FF41&text_color=88ffaa&border_radius=12&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Dhrona1421&layout=compact&theme=merko&hide_border=true&bg_color=050f05&title_color=00FF41&text_color=88ffaa&border_radius=12&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=Dhrona1421&theme=merko&hide_border=true&background=050f05&ring=00FF41&fire=44ff44&currStreakLabel=00FF41&sideLabels=88ffaa&dates=66cc66&border_radius=12&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile stats"
          git push
